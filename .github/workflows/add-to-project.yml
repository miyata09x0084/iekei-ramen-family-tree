# 新規 issue をロードマップ Project に追加し、Status を Inbox にする。
# 設計の経緯: docs/adr/0001-issue-triage-with-github-project.md
#
# 必要な secret: ADD_TO_PROJECT_PAT
#   ユーザー所有の Project は GITHUB_TOKEN では操作できないため、
#   `project` スコープ付きの classic PAT を repo secret に登録する。
name: Add issue to roadmap

on:
  issues:
    types: [opened, reopened]

permissions:
  issues: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        id: add
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/miyata09x0084/projects/3
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

      - name: Set Status to Inbox
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
          ITEM_ID: ${{ steps.add.outputs.itemId }}
          # Project「iekei-ramen-family-tree ロードマップ」の ID
          PROJECT_ID: PVT_kwHOA4cuEM4Bkphn
          # Status フィールドと Inbox オプションの ID
          STATUS_FIELD_ID: PVTSSF_lAHOA4cuEM4BkphnzhjZYmw
          INBOX_OPTION_ID: d8283a16
        run: |
          gh api graphql \
            -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){
              updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){
                projectV2Item{ id }
              }
            }' \
            -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$STATUS_FIELD_ID" -f o="$INBOX_OPTION_ID"
